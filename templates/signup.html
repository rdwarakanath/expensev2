<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SplitWise — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="bg-mesh">
    <div class="mesh-orb orb-1"></div>
    <div class="mesh-orb orb-2"></div>
    <div class="mesh-orb orb-3"></div>
  </div>
  <div class="grain"></div>

  <div class="stage">
    <div class="auth-card">

      <div class="auth-brand">
        <p class="hero-label">SPLITWISE</p>
        <h1 class="auth-title">Create account</h1>
        <p class="modal-hint">Start tracking trips with your group.</p>
      </div>

      {% if error %}
      <div class="auth-error">⚠ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/signup" class="auth-form">
        <label class="field-label">Username</label>
        <input type="text" name="username" class="field" placeholder="choose a username" autocomplete="username" required />

        <label class="field-label">Email</label>
        <input type="email" name="email" class="field" placeholder="you@example.com" autocomplete="email" required />

        <label class="field-label">Password</label>
        <input type="password" name="password" class="field" placeholder="min. 6 characters" autocomplete="new-password" required />

        <label class="field-label">Confirm Password</label>
        <input type="password" name="confirm" class="field" placeholder="repeat password" autocomplete="new-password" required />

        <button type="submit" class="btn-primary auth-submit">Create Account →</button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="/login" class="auth-link">Sign in</a>
      </p>

    </div>
  </div>

</body>
</html>
