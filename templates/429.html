<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Too many requests — PayBait" />
  <title>PayBait — 429 Too Many Requests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <style>
    .error-stage {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .error-card {
      text-align: center;
      max-width: 480px;
      width: 100%;
      background: rgba(17, 20, 30, 0.72);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 56px 40px 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 40px rgba(139,92,246,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: cardIn 0.4s cubic-bezier(0.34,1.3,0.64,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .error-code {
      font-family: 'Syne', 'Segoe UI', Arial, sans-serif;
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 50%, #a78bfa 100%);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 0%; }
      100% { background-position: 200%; }
    }
    .error-label {
      font-family: 'Syne', 'Segoe UI', Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: #a78bfa;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .error-title {
      font-family: 'Syne', 'Segoe UI', Arial, sans-serif;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .error-sub {
      color: #94a3b8;
      font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
      font-size: 0.97rem;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    .error-icon {
      font-size: 3rem;
      margin-bottom: 24px;
      display: block;
      filter: drop-shadow(0 0 16px rgba(139,92,246,0.3));
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fbbf24;
      color: #000;
      font-family: 'Syne', 'Segoe UI', Arial, sans-serif;
      font-weight: 700;
      font-size: 0.94rem;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      letter-spacing: 0.01em;
    }
    .error-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251,191,36,0.35);
    }
    .error-btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: #94a3b8;
      font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
      font-size: 0.94rem;
      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .error-btn-ghost:hover {
      background: rgba(255,255,255,0.08);
      color: #f1f5f9;
    }
    /* Countdown timer pill */
    .retry-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 100px;
      padding: 8px 18px;
      font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
      font-size: 0.88rem;
      color: #a78bfa;
      margin-bottom: 28px;
    }
    .retry-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
  </style>
</head>
<body>

  <div class="bg-mesh">
    <div class="mesh-orb orb-1"></div>
    <div class="mesh-orb orb-2"></div>
    <div class="mesh-orb orb-3"></div>
  </div>
  <div class="grain"></div>

  <div class="error-stage">
    <div class="error-card">
      <span class="error-icon">⏱️</span>
      <div class="error-code">429</div>
      <p class="error-label">Too Many Requests</p>
      <h1 class="error-title">Slow down a little.</h1>
      <div class="retry-pill">
        <span class="retry-dot"></span>
        Please wait before trying again
      </div>
      <p class="error-sub">
        You've sent too many requests in a short time.<br>
        Take a breath and try again in a moment.
      </p>
      <div class="error-actions">
        <a href="/home" class="error-btn-primary">← Back to Home</a>
        <a href="javascript:location.reload()" class="error-btn-ghost">Try Again</a>
      </div>
    </div>
  </div>

</body>
</html>
